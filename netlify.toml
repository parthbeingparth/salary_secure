# Salary Secure — Netlify + Next.js App Router

[build]
  command = "npm run build"
  # Leave publish empty when using the Next.js runtime plugin.
  # Do NOT set publish = ".next" (that breaks App Router / SSR).

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Form blueprints: public/__forms.html + NetlifyFormsBlueprints in layout.
# Email notifications: configure in Netlify UI → Forms (not here).
#
# Optional env (Netlify UI → Environment variables):
#   NEXT_PUBLIC_SITE_URL=https://your-domain.netlify.app
#
# Future secrets (Resend, WhatsApp API, etc.) belong ONLY in the Netlify UI —
# never NEXT_PUBLIC_* and never committed here.
