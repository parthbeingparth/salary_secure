# Salary Secure — Netlify

[build]
  command = "npm run build"

# Use the official Next.js runtime on Netlify (install as a site plugin if needed).
# Form blueprints live in public/__forms.html and are also rendered in the app layout.
#
# Email notifications for form submissions are configured in the Netlify UI —
# never put SMTP credentials or notification secrets in this file.
#
# Future server-only secrets (WhatsApp Cloud API, Resend, SendGrid, Meta app secrets)
# belong ONLY in: Netlify Dashboard → Site configuration → Environment variables
# Never commit them here or expose them as NEXT_PUBLIC_* / VITE_* variables.
