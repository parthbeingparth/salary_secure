# Salary Secure — Netlify + Next.js App Router
#
# With @netlify/plugin-nextjs, publish must be ".next" (not empty / not ".").
# Empty publish resolves to the repo root and fails with:
# "publish directory cannot be the same as the base directory"

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Form blueprints: public/__forms.html + NetlifyFormsBlueprints in layout.
# Email notifications: Netlify UI → Forms (not here).
#
# Optional env (Netlify UI → Environment variables):
#   NEXT_PUBLIC_SITE_URL=https://your-site.netlify.app
